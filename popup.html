<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 300px; background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', monospace; padding: 16px; }
  h1 { color: #58a6ff; font-size: 16px; margin-bottom: 4px; }
  p  { color: #8b949e; font-size: 12px; margin-bottom: 14px; }
  .status { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot-idle    { background: #555; }
  .dot-waiting { background: #d29922; animation: pulse 1s infinite; }
  .dot-ready   { background: #3fb950; }
  .dot-error   { background: #f85149; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .file-row { display: flex; justify-content: space-between; align-items: center;
    background: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 8px 10px; margin: 4px 0; font-size: 12px; }
  .badge { font-size: 10px; padding: 2px 6px; border-radius: 8px; }
  .badge-glb { background: #1a4a1f; color: #3fb950; border: 1px solid #2ea043; }
  .badge-tex { background: #1a3a5c; color: #58a6ff; border: 1px solid #1f6feb; }
  .btn { width: 100%; background: #238636; color: #fff; border: none; padding: 10px;
    border-radius: 6px; cursor: pointer; font-size: 14px; margin-top: 8px; }
  .btn:hover:not(:disabled) { background: #2ea043; }
  .btn:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }
  .hint { color: #6e7681; font-size: 11px; margin-top: 10px; line-height: 1.5; }
  .settings { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; align-items: center; color: #8b949e; font-size: 12px; }
  .formats { display: flex; gap: 4px; margin: 6px 0 12px; }
  .fmt { flex: 1; text-align: center; padding: 6px 0; border-radius: 6px; cursor: pointer;
    border: 1px solid #30363d; background: #0d1117; color: #8b949e; font-size: 11px; }
  .fmt.active { background: #1f6feb; border-color: #58a6ff; color: #fff; }
  input[type=range] { width: 100%; margin: 6px 0; accent-color: #1f6feb; }
  input[type=range]:disabled { opacity: .4; }
  .stats { color: #6e7681; font-size: 11px; min-height: 16px; }
  .dim { opacity: .4; }
</style>
</head>
<body>
<h1>🔓 Meshy Downloader</h1>
<p>Откройте страницу модели Meshy, чтобы включить скачивание.</p>

<div class="status">
  <span class="dot dot-idle" id="dot"></span>
  <span id="statusText">Ожидание...</span>
</div>

<div class="settings">
  <div class="row"><span>Формат</span></div>
  <div class="formats" id="formats"></div>
  <div class="row" id="ratioRow"><span>Детализация</span><span id="ratioVal">100%</span></div>
  <input type="range" id="ratio" min="5" max="100" step="5" value="100">
  <div class="stats" id="stats"></div>
</div>

<div id="fileList"></div>
<button class="btn" id="btnDl" disabled>⬇️ Скачать</button>

<p class="hint" id="hint">💡 Перейдите на страницу модели Meshy.<br>Просмотрщик 3D должен загрузить модель.</p>

<script src="popup.js"></script>
</body>
</html>
